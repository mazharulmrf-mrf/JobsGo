name: Setup Android Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build web app
        working-directory: app
        run: npm run build

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: app
        run: npx cap sync android

      - name: Check Android folder
        run: |
          echo "Checking Android folder..."
          ls -la app
          ls -la app/android

      - name: Commit Android project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app/android

          git commit -m "Add Android project" || echo "No changes to commit"

          git push
